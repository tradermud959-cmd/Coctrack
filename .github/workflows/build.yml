name: Build Debug APK
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project type: "android" for native Gradle, "flutter" for Flutter'
        required: true
        default: 'android'

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: ${{ github.event.inputs.project == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        if: ${{ github.event.inputs.project == 'android' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        if: ${{ github.event.inputs.project == 'android' }}
        run: chmod +x ./gradlew

      - name: Build Android Gradle debug APK
        if: ${{ github.event.inputs.project == 'android' }}
        run: |
          set -e
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      - name: Set up Flutter
        if: ${{ github.event.inputs.project == 'flutter' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install Flutter dependencies
        if: ${{ github.event.inputs.project == 'flutter' }}
        run: flutter pub get

      - name: Build Flutter debug APK
        if: ${{ github.event.inputs.project == 'flutter' }}
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        if: ${{ github.event.inputs.project == 'android' || github.event.inputs.project == 'flutter' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            build/app/outputs/flutter-apk/*.apk
